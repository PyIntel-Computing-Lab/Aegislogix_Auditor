{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AegisLogix | Settings</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }
        
        .settings-container {
            max-width: 800px;
            margin: 50px auto;
        }
        
        .settings-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }
        
        .settings-icon {
            width: 80px;
            height: 80px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            font-size: 32px;
        }
        
        .title {
            font-weight: bold;
            margin-top: 15px;
        }
        
        label {
            font-weight: 600;
        }
        
        .btn {
            padding: 11px;
        }
    </style>

</head>

<body>

    <div class="container settings-container">

        <div class="settings-card">

            <!-- HEADER -->

            <div class="text-center mb-4">

                <div class="settings-icon">

                    <i class="fa-solid fa-gear"></i>

                </div>

                <h2 class="title">
                    Account Settings
                </h2>

                <p class="text-muted">
                    Update your AegisLogix account information
                </p>

            </div>


            <!-- SUCCESS MESSAGE -->

            {% if success %}

            <div class="alert alert-success">

                <i class="fa-solid fa-circle-check me-2"></i> {{ success }}

            </div>

            {% endif %}


            <!-- ERROR MESSAGE -->

            {% if error %}

            <div class="alert alert-danger">

                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}

            </div>

            {% endif %}


            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label class="form-label">
                    Full Name
                </label>

                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>

                </div>


                <!-- USERNAME -->

                <div class="mb-3">

                    <label class="form-label">
                    Username
                </label>

                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                    Email Address
                </label>

                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>

                </div>


                <!-- PHONE -->

                <div class="mb-3">

                    <label class="form-label">
                    Phone Number
                </label>

                    <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" maxlength="10" pattern="[0-9]{10}" required>

                </div>


                <hr class="my-4">


                <h5 class="mb-3">

                    <i class="fa-solid fa-lock me-2"></i> Change Password

                </h5>


                <!-- NEW PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                    New Password
                </label>

                    <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">
                    Confirm New Password
                </label>

                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password">

                </div>


                <!-- BUTTONS -->

                <div class="d-grid gap-2">

                    <button type="submit" class="btn btn-primary">

                    <i class="fa-solid fa-floppy-disk me-2"></i>

                    Save Changes

                </button>


                    <a href="{% url 'profile' %}" class="btn btn-secondary">

                        <i class="fa-solid fa-user me-2"></i> View Profile

                    </a>


                    <a href="{% url 'dashboard' %}" class="btn btn-outline-dark">

                        <i class="fa-solid fa-arrow-left me-2"></i> Back to Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
