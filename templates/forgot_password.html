{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AegisLogix | Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }
        
        .forgot-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 32px;
        }
        
        .title {
            font-weight: bold;
            margin-top: 20px;
        }
        
        .form-label {
            font-weight: 600;
        }
        
        .btn {
            padding: 11px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="forgot-card mx-auto">

            <!-- HEADER -->

            <div class="text-center">

                <div class="icon">

                    <i class="fa-solid fa-key"></i>

                </div>

                <h2 class="title">
                    Forgot Password?
                </h2>

                <p class="text-muted">

                    Reset your AegisLogix account password

                </p>

            </div>


            <!-- SUCCESS -->

            {% if success %}

            <div class="alert alert-success mt-4">

                <i class="fa-solid fa-circle-check me-2"></i> {{ success }}

            </div>

            <div class="d-grid mt-3">

                <a href="{% url 'login' %}" class="btn btn-primary">

                    <i class="fa-solid fa-right-to-bracket me-2"></i> Go to Login

                </a>

            </div>

            {% else %}


            <!-- ERROR -->

            {% if error %}

            <div class="alert alert-danger mt-4">

                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}

            </div>

            {% endif %}


            <!-- FORM -->

            <form method="POST" class="mt-4">

                {% csrf_token %}


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">

                    Email Address

                </label>

                    <input type="email" name="email" class="form-control" placeholder="Enter your registered email" value="{{ email|default:'' }}" required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">

                    New Password

                </label>

                    <input type="password" name="password" class="form-control" placeholder="Enter new password" minlength="6" required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">

                    Confirm New Password

                </label>

                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" minlength="6" required>

                </div>


                <!-- RESET BUTTON -->

                <div class="d-grid">

                    <button type="submit" class="btn btn-primary">

                    <i class="fa-solid fa-key me-2"></i>

                    Reset Password

                </button>

                </div>


                <!-- LOGIN -->

                <p class="text-center mt-4">

                    Remember your password?

                    <a href="{% url 'login' %}">

                    Login

                </a>

                </p>


                <!-- HOME -->

                <p class="text-center">

                    <a href="{% url 'home' %}">

                    ← Back to Home

                </a>

                </p>

            </form>

            {% endif %}

        </div>

    </div>

</body>

</html>
