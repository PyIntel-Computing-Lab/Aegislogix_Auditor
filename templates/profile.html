{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AegisLogix | Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }
        
        .profile-container {
            max-width: 750px;
            margin: 60px auto;
        }
        
        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }
        
        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 40px;
        }
        
        .profile-title {
            font-weight: bold;
            margin-top: 15px;
        }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .info-label {
            font-weight: bold;
            color: #555;
        }
        
        .info-value {
            color: #222;
            margin-top: 5px;
        }
        
        .back-btn {
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <div class="container profile-container">

        <div class="profile-card">

            <!-- PROFILE HEADER -->

            <div class="text-center">

                <div class="profile-icon">

                    <i class="fa-solid fa-user"></i>

                </div>

                <h2 class="profile-title">
                    My Profile
                </h2>

                <p class="text-muted">
                    AegisLogix Cloud Auditor Account
                </p>

            </div>


            <hr class="my-4">


            <!-- FULL NAME -->

            <div class="info-box">

                <div class="info-label">

                    <i class="fa-solid fa-user me-2"></i> Full Name

                </div>

                <div class="info-value">

                    {{ user.full_name }}

                </div>

            </div>


            <!-- USERNAME -->

            <div class="info-box">

                <div class="info-label">

                    <i class="fa-solid fa-id-badge me-2"></i> Username

                </div>

                <div class="info-value">

                    {{ user.username }}

                </div>

            </div>


            <!-- EMAIL -->

            <div class="info-box">

                <div class="info-label">

                    <i class="fa-solid fa-envelope me-2"></i> Email Address

                </div>

                <div class="info-value">

                    {{ user.email }}

                </div>

            </div>


            <!-- PHONE -->

            <div class="info-box">

                <div class="info-label">

                    <i class="fa-solid fa-phone me-2"></i> Phone Number

                </div>

                <div class="info-value">

                    {{ user.phone }}

                </div>

            </div>


            <!-- ACCOUNT CREATED -->

            <div class="info-box">

                <div class="info-label">

                    <i class="fa-solid fa-calendar me-2"></i> Account Created

                </div>

                <div class="info-value">

                    {{ user.created_at|date:"d M Y, h:i A" }}

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="d-grid gap-2 back-btn">

                <a href="{% url 'settings' %}" class="btn btn-primary">

                    <i class="fa-solid fa-gear me-2"></i> Edit Profile

                </a>

                <a href="{% url 'dashboard' %}" class="btn btn-secondary">

                    <i class="fa-solid fa-arrow-left me-2"></i> Back to Dashboard

                </a>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
