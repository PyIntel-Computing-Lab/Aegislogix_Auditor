{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisLogix | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <section class="register-section">

        <div class="container">

            <div class="row justify-content-center align-items-center vh-100">

                <div class="col-lg-6 col-md-8">

                    <div class="register-card">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-shield-halved logo"></i>

                            <h2>Create Your Account</h2>

                            <p>Join AegisLogix Cloud Auditor Platform</p>

                        </div>

                        {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                        {% endif %}

                        <form method="POST" id="registerForm">

                            {% csrf_token %}

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>Full Name</label>

                                    <input type="text" name="full_name" id="fullname" class="form-control" placeholder="Enter Full Name" pattern="[A-Za-z ]+" title="Only alphabets are allowed" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')" required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Username</label>

                                    <input type="text" name="username" class="form-control" placeholder="Enter Username" required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Email Address</label>

                                <input type="email" name="email" class="form-control" placeholder="Enter Email" required>

                            </div>

                            <div class="mb-3">

                                <label>Phone Number</label>

                                <input type="tel" name="phone" id="phone" class="form-control" placeholder="Enter Phone Number" maxlength="10" pattern="[0-9]{10}" title="Enter 10 digit phone number" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>Password</label>

                                    <div class="input-group">

                                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required> <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">

<i id="eye1" class="fa-solid fa-eye"></i>

</button>

                                    </div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Confirm Password</label>

                                    <div class="input-group">

                                        <input type="password" id="confirmPassword" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="toggleConfirmPassword()">

            <i id="eye2" class="fa-solid fa-eye"></i>

        </button>

                                    </div>

                                    <!-- Password error message -->
                                    <div id="passwordError" class="text-danger mt-2"></div>

                                </div>


                                <div class="form-check mb-3">

                                    <input class="form-check-input" type="checkbox" required>

                                    <label class="form-check-label">
                                I agree to the Terms & Conditions
                            </label>

                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                            Create Account
                        </button>

                                <p class="text-center mt-3">

                                    Already have an account?

                                    <a href="{% url 'login' %}">
                                Login
                            </a>

                                </p>

                                <p class="text-center">

                                    <a href="{% url 'home' %}">
                                ← Back to Home
                            </a>

                                </p>

                        </form>

                        </div>

                    </div>

                </div>

            </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {

            const password = document.getElementById("password").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            const error = document.getElementById("passwordError");

            if (password !== confirmPassword) {

                event.preventDefault();

                error.innerHTML = "❌ Password and Confirm Password do not match.";

            } else {

                error.innerHTML = "";

            }

        });
    </script>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eye1");

            if (password.type === "password") {
                password.type = "text";
                eye.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                password.type = "password";
                eye.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function toggleConfirmPassword() {
            const confirm = document.getElementById("confirmPassword");
            const eye = document.getElementById("eye2");

            if (confirm.type === "password") {
                confirm.type = "text";
                eye.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                confirm.type = "password";
                eye.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>

</body>

</html>
